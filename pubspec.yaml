name: medicinnect
description: MediHub - Patient Mobile Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0
  google_sign_in: ^6.2.1

  # State Management
  provider: ^6.1.1

  # Notifications
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4
  flutter_timezone: ^5.1.0

  # UI
  table_calendar: ^3.1.2
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.9

  # Storage & Utilities
  shared_preferences: ^2.3.2
  intl: ^0.19.0

  # HTTP — for web backend communication
  http: ^1.2.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true