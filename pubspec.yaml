name: medicinnect
description: MediCinnect - Patient Mobile Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.13.6
  google_sign_in: ^6.2.1

  # State Management
  provider: ^6.1.1

  # Notifications
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.2

  # UI
  table_calendar: ^3.0.9
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.9

  # Storage & Utilities
  shared_preferences: ^2.2.2
  intl: ^0.18.1

  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
